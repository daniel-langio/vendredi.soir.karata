name: Web UI CI

# Kept separate from ci.yml, which POJA's own tooling manages and has silently reverted before
# (see commit 4dbc88f) - a dedicated file here isn't at risk of being stripped by that.

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  web-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4.1.6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
          cache: true

      - working-directory: web-ui
        run: flutter pub get

      - working-directory: web-ui
        run: flutter analyze

      - working-directory: web-ui
        run: flutter test

      - working-directory: web-ui
        run: flutter build web --release --pwa-strategy=none
