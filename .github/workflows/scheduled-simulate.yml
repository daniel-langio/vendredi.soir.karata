name: Scheduled Simulate (temporary soak test)

# Time-boxed soak test: runs a 50-hand simulation against the live karata0 deployment every 30
# minutes. Started at every 5 minutes (GitHub Actions' minimum schedule interval), but that fired
# only once automatically in ~7.5 hours - very frequent schedules are best-effort on GitHub's side
# and can be silently dropped for long stretches under platform load, with nothing actionable on
# this end to fix it; 30 minutes is far more reliably honored in practice. Each run checks the
# deadline below first and no-ops past it - cheap, but the cron trigger itself keeps firing forever
# until this file's `schedule:` block (or the whole file) is removed/disabled, since GitHub has no
# built-in way to expire a schedule automatically.
#
# `concurrency` (queue, don't cancel) avoids two runs fighting over the same two shared test
# users' wallets if a run ever takes longer than the interval.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

concurrency:
  group: scheduled-simulate
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check deadline
        id: deadline
        run: |
          deadline="2026-09-10T02:00:00Z"  # 2026-09-10 05:00 UTC+3
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [[ "$now" > "$deadline" ]]; then
            echo "Past deadline ($deadline UTC) - skipping this run."
            echo "expired=true" >> "$GITHUB_OUTPUT"
          else
            echo "expired=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4.1.6
        if: steps.deadline.outputs.expired == 'false'

      - name: Simulate 50-hand game
        if: steps.deadline.outputs.expired == 'false'
        env:
          API_URL: https://preprod-karata-210977503792.southamerica-east1.run.app/poker
          HANDS: '50'
          SMALL_BLIND: '10'
          BIG_BLIND: '20'
          BUY_IN: '500'
        run: python3 .github/scripts/simulate_full_game.py
