server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5442/postgres}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SECURITY: this default is fine for local dev and CI (Testcontainers, ephemeral DBs) but must be
# overridden with a real secret via the JWT_SECRET env var in any shared/deployed environment -
# anyone who knows this value can forge valid tokens for any username.
jwt.secret=${JWT_SECRET:dev-only-insecure-default-secret-change-me-in-any-real-environment}

# ifay is the payment claim/report API - karata is a client, submitting claims on behalf of a
# buyer purchasing chips through the marketplace. This key must be overridden in any shared/
# deployed environment (must match whatever IFAY_CLIENT_API_KEY ifay itself is configured with).
ifay.base-url=${IFAY_BASE_URL:https://ifay-232007348727.southamerica-east1.run.app}
ifay.client-api-key=${IFAY_CLIENT_API_KEY:dev-only-insecure-client-key-change-me}

# Comma-separated usernames allowed to create a marketplace listing - real users can't sell yet,
# only the operator ("dev") can, until peer-to-peer resale ships.
marketplace.seller-allowlist=${MARKETPLACE_SELLER_ALLOWLIST:dev}
